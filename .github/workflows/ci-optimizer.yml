name: CI Optimizer

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  CI Optimizer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/optimizer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/optimizer/requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile app/main.py
